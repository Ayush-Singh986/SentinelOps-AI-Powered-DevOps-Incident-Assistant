name: Deploy SentinelOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Lambda code
        run: |
          pip install flake8
          flake8 lambda/handler.py --max-line-length=100

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init & validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -var="log_group_name=${{ vars.LOG_GROUP_NAME }}"

      - name: Push secrets to SSM
        run: |
          aws ssm put-parameter --name "/sentinelops/slack_webhook_url" \
            --value "${{ secrets.SLACK_WEBHOOK_URL }}" --type SecureString --overwrite
          aws ssm put-parameter --name "/sentinelops/anthropic_api_key" \
            --value "${{ secrets.ANTHROPIC_API_KEY }}" --type SecureString --overwrite
